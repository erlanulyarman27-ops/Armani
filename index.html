<!DOCTYPE html>
<html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ерлер киімі | Дүкен</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head>
<body><div id="hdr"></div><main>
<h1>Ерлерге арналған киім дүкені</h1>
<div class="tools"><input id="q" type="search" placeholder="Тауар іздеу" aria-label="Іздеу"><select id="s" aria-label="Сұрыптау"><option value="">Рейтинг бойынша</option><option value="a">Арзанырақ</option><option value="d">Қымбатырақ</option></select></div>
<div class="grid" id="g"></div>
</main><div id="ftr"></div>
<script>
const g=document.getElementById("g"),q=document.getElementById("q"),s=document.getElementById("s");
function draw(){
 let a=P.filter(p=>p.name.toLowerCase().includes(q.value.toLowerCase()));
 if(s.value==="a")a=[...a].sort((x,y)=>x.price-y.price);
 if(s.value==="d")a=[...a].sort((x,y)=>y.price-x.price);
 g.innerHTML=a.length?"":"<p class=muted>Ештеңе табылмады.</p>";
 a.forEach(p=>{const c=document.createElement("article");c.className="card";
  c.innerHTML=`<a href="product.html?id=${p.id}"><div class="pic">${p.emoji}</div></a><a class="n" href="product.html?id=${p.id}">${p.name}</a><div class="${p.stock?"ok":"muted"}">${p.stock?"Бар":"Тапсырыс бойынша"}</div><div class="price">${fmt(p.price)}</div><div class="muted">${p.seller}</div>`;
  const b=document.createElement("button");b.textContent="Сатып алу";b.onclick=()=>addToCart(p.id);c.appendChild(b);g.appendChild(c)});
}
q.oninput=s.onchange=draw;draw();
</script>
</body></html>
